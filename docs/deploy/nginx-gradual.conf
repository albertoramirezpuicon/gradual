# nginx site for Gradual (D55). Replace gradual.example.com with the real subdomain.
# Install: copy to /etc/nginx/sites-available/gradual, symlink into sites-enabled,
# `sudo nginx -t && sudo systemctl reload nginx`, then run certbot for HTTPS.

server {
    listen 80;
    server_name gradual.example.com;

    # Files go straight to S3 with signed URLs, so request bodies stay small.
    client_max_body_size 2m;

    # API (Express) — /api/v1/*
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CV PDF/DOCX generation can take a few seconds
        proxy_read_timeout 60s;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
